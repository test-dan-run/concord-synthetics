# Stages 1, 2 (turn plan) and 6. Design doc "Turn-taking".
turn_taking:
  zipf: {dist: zipf, exponent: 1.0}                # the chair takes the top share
  gap: {dist: lognormal, median: 0.3, sigma: 0.6, cap: 2.0}
  overlap_share: 0.3                               # of transitions; the other 70% use `gap`
  overlap_lead: {dist: uniform, lo: 0.1, hi: 1.0}
  overlap_max_frac: 0.5
  overlap_target:
    small: {dist: uniform, lo: 0.10, hi: 0.20}
    large: {dist: uniform, lo: 0.15, hi: 0.25}
  interruption_rate: {dist: uniform, lo: 0.05, hi: 0.10}
  interruption_cutoff: {dist: uniform, lo: 0.3, hi: 1.5}
  backchannels_per_min: {dist: uniform, lo: 1.0, hi: 3.0}
  long_pause_p: 0.02
  long_pause: {dist: uniform, lo: 1.0, hi: 3.0}
  side_conversations_per_10min:
    small: {dist: uniform, lo: 0.0, hi: 0.3}
    large: {dist: uniform, lo: 0.0, hi: 1.0}
  side_conversation_turns: {dist: int_uniform, lo: 2, hi: 4}
