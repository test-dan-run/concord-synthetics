[project]
name = "synthetics"
version = "0.1.0"
description = "Synthetic Singapore meeting audio with full labels, generated on the personal AI platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.12,<3",
    "pyyaml>=6.0.3",
    "numpy>=2.1",
    "soundfile>=0.13",
    "soxr>=0.5",
    "typer>=0.20",
    "httpx>=0.28.1",
    "openai>=2.0",
    "jiwer>=4.0",
    "aicore[oip]",
    "scipy>=1.18.1",
    "pyroomacoustics>=0.10.1",
]

[project.scripts]
synthetics = "synthetics.orchestrator.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/synthetics"]

[tool.uv.sources]
aicore = { path = "../../platform/clients/aicore", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "tests"]
addopts = "--import-mode=importlib -m 'not live and not slow'"
markers = [
    "live: needs running platform services (run with `just test-live`)",
    "slow: large-sample distribution checks (run with `just test-slow`)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
